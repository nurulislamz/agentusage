name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.12.2

  vet:
    name: Vet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install C compiler (CGO for sqlite3)
        run: sudo apt-get update && sudo apt-get install -y gcc

      - run: go vet ./...

  test:
    name: Test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      CGO_ENABLED: "1" # mattn/go-sqlite3 (cursor provider + telemetry store)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install C compiler (CGO for sqlite3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      # macOS ships clang; the windows-latest image ships mingw-w64 gcc on PATH.

      - name: Run tests
        shell: bash # pwsh mangles `-coverprofile=coverage.out` into a `.out` package arg
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: coverage.out

  build:
    # Pin the per-matrix display name so the required status-check context
    # stays "Build (<os>)" and does not leak the `bin` matrix axis
    # (otherwise it becomes "Build (ubuntu-latest, openusage)" and branch
    # protection never sees the context it requires).
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: agentusage
          - os: macos-latest
            bin: agentusage
          - os: windows-latest
            bin: agentusage.exe
    env:
      CGO_ENABLED: "1" # mattn/go-sqlite3 (cursor provider + telemetry store)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Install C compiler (CGO for sqlite3)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y gcc

      # macOS ships clang; the windows-latest image ships mingw-w64 gcc on PATH.

      - name: Build binary
        shell: bash
        run: go build -ldflags="-s -w" -o ${{ matrix.bin }} ./cmd/agentusage

      - name: Verify binary
        shell: bash
        run: ls -la ${{ matrix.bin }}

  fmt:
    name: gofmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

  tidy:
    name: Check go.mod tidiness
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Check go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Verify module checksums
        run: go mod verify

  icon-font:
    name: Icon font up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Verify committed icon font matches its sources
        run: |
          python -m pip install --quiet 'fonttools==4.63.0'
          python scripts/gen-icon-font.py
          git diff --exit-code internal/tmux/assets/openusage-icons.ttf \
            || (echo "::error::committed icon font is stale; run 'make icon-font' and commit the result" && exit 1)

  docker-build:
    name: Docker Build & Smoke Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build agentusage test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          load: true
          tags: agentusage:test
          build-args: |
            VERSION=test
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=2026-01-01T00:00:00Z

      - name: Build agentusage-hub test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.hub
          load: true
          tags: agentusage-hub:test
          build-args: |
            VERSION=test
            COMMIT_HASH=${{ github.sha }}
            BUILD_DATE=2026-01-01T00:00:00Z

      - name: Smoke test agentusage image
        run: |
          docker run -d --name test-agentusage -p 9190:9190 -e AGENTUSAGE_HUB_TOKEN="ci-smoke-token" agentusage:test hub --headless
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:9190/healthz >/dev/null 2>&1; then
              echo "agentusage container is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "agentusage container failed health check"
              docker logs test-agentusage
              docker stop test-agentusage
              exit 1
            fi
            sleep 1
          done
          docker stop test-agentusage

      - name: Smoke test agentusage-hub image
        run: |
          docker run -d --name test-agentusage-hub -p 9190:9190 -e AGENTUSAGE_HUB_TOKEN="ci-smoke-token" agentusage-hub:test
          for i in $(seq 1 30); do
            if curl -fsSL http://127.0.0.1:9190/healthz >/dev/null 2>&1; then
              echo "agentusage-hub container is healthy"
              break
            fi
            if [ "$i" -eq 30 ]; then
              echo "agentusage-hub container failed health check"
              docker logs test-agentusage-hub
              docker stop test-agentusage-hub
              exit 1
            fi
            sleep 1
          done
          docker stop test-agentusage-hub

