services:
  prometheus:
    image: docker.io/prom/prometheus:latest
    container_name: agentusage-prometheus
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro,Z
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/tmp/prometheus-data'
      - '--web.listen-address=0.0.0.0:9090'

  grafana:
    image: docker.io/grafana/grafana:latest
    container_name: agentusage-grafana
    network_mode: host
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/provisioning/dashboards/agy-boxes.json
      - GF_USERS_DEFAULT_THEME=dark
    volumes:
      - ./provisioning/datasources:/etc/grafana/provisioning/datasources:ro,Z
      - ./provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro,Z
